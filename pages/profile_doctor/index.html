    <style>
      body {
        background-color: #f8f9fa; /* Light background color */
        /* box-sizing: border-box; */
      }
      .section {
        background-color: #ffffff; /* White background for sections */
        padding: 20px;
        border-radius: 8px; /* Rounded corners */
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
        margin-bottom: 20px; /* Space below each section */
      }
      .profile-img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
      }
      .rating {
        color: gold;
      }
      .specializations {
        display: -webkit-box;
        display: -ms-flexbox;
        display: flex;
        -webkit-box-orient: vertical;
        overflow: hidden; /* Hide overflow */
        line-height: 1.5; /* Line height for spacing */
        max-height: 3em; /* Limit height to 2 lines */
      }
      .more-specializations {
        display: none; /* Initially hidden */
      }
      .gap {
        margin-left: 15px; /* Gap between sections */
      }
      .primary-bg {
        background-color: #007bff; /* Bootstrap primary color */
        color: white; /* Contrasting color */
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px; /* Space below the header */
      }
      .red-button {
        background-color: red; /* Red background for button */
        color: white; /* Contrasting text color */
        border: none; /* Remove border */
      }
      .hour-item {
        cursor: pointer; /* Pointer cursor for clickable hours */
        transition: background-color 0.3s; /* Smooth transition */
      }
      .hour-item:hover {
        background-color: #0056b3; /* Darker blue on hover */
        color: white; /* Change text color on hover */
      }

      .hour-item {
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .hour-item:hover {
        background-color: #0056b3;
        color: white;
      }
      .booking-form {
        display: none;
      }
      .text-rtl {
        direction: rtl;
        text-align: right;
      }
      .line-separator {
        border-top: 2px solid #e6e6e6;
        margin: 20px 0;
      }
      .more-button,
      .less-button {
        display: block;
        margin: 10px 0;
        cursor: pointer;
        color: #007bff;
      }
      .more-button:hover,
      .less-button:hover {
        text-decoration: underline;
      }

      @media screen and (min-width: 770px) {
        .booking-info {
          position: sticky;
          top: 20px; /* Distance from the top of the viewport */
          z-index: 1000; /* Ensure it appears above other content */
        }
      }

      .text-rtl {
        background: white;
        margin: 0px 0px 15px;
        direction: rtl;
        text-align: right;
        border-radius: 10px;
        padding: 25px;
        width: calc(100% - 50px);
      }

      .fs {
        font-size: 30px;
        color: #007bff;
      }

      #patientForm {
        text-align: right;
      }

      .card h2 {
        font-size: 1.5rem;
        font-weight: bold;
        color: #666;
      }

      .form-select {
        width: 80px;
        padding: 5px;
        display: inline-block;
        margin-right: 7px;
        vertical-align: middle;
      }

      #patientPhone {
        width: calc(100% - 90px);
        padding: 10px;
        display: inline-block;
        vertical-align: middle;
      }

      /* إضافة خط أفقي */
      .card hr,
      hr {
        margin: 20px 0;
        border-top: 1px solid #ccc;
      }

      .btn-danger {
        width: 150px;
        font-size: 1rem;
        padding: 10px;
      }

      .btn-outline-secondary {
        width: 150px;
        font-size: 1rem;
        padding: 10px;
      }

      /* الهوامش للأيقونات */
      .fas {
        margin-bottom: 10px;
      }

      /* المواعيد ثلاثة أعمدة على الشاشات الصغيرة */
      .col-4 {
        flex: 0 0 33.33%;
        max-width: 33.33%;
      }

      /* جعل الأزرار تمتد عبر العمود */
      .btn {
        width: 100%;
      }

      /* تفاعل الصفحة مع الشاشات الصغيرة */
    </style>
  </head>
