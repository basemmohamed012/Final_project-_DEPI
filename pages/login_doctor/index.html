        .sign-up-container {
            max-width: 100%; /* Full width of container */

            margin: 20px auto; /* Center the div and add space above */

                width: fit-content;
            }
        }
        .sign-up-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px; /* Height of the top border */
            background: linear-gradient(to right, #0070cd 30%, #b6d6f0 30%); /* Gradient border */

        }
        .navbar-brand {
            position: relative;
            font-size: 24px; /* Adjust the font size as needed */
        }
        .navbar-brand .letter-a {
            position: relative;
            top: -8px; /* Move 'A' higher */
        }
        .navbar-brand .dot-com {
            color: red; /* Color for .com */
        }
        .navbar-brand .underline {
            position: absolute;
            bottom: -2px; /* Adjust to position the line */
            left: 0;
            width: 10px; /* Width of the underline */
            height: 2px; /* Thickness of the underline */
            background-color: red;
        }
        .btn-custom {
            background-color: white; /* Button background color */
            border: 1px solid black; /* Solid black border */
            color: #0070cd; /* Button text color */
        }
        footer {
